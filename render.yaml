# Render blueprint for the backend (NestJS API). In Render: New > Blueprint > pick this repository.
# Secrets marked "sync: false" are asked for once in the Render dashboard (never put them here).
# The website itself goes on Vercel (see DEPLOY.md).
services:
  - type: web
    name: acacia-api
    runtime: node
    rootDir: backend
    # "starter" (paid) stays awake: the daily reminder emails and live updates need that.
    # The free plan sleeps after 15 minutes without visitors.
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    # Applies new database changes before each start (safe to run every time)
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /api/packages
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Vercel's proxy + Render's proxy stand in front of the API
      - key: TRUST_PROXY
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The website's address(es), first one used in email links, e.g. https://acaciasafaris.com
      - key: FRONTEND_URL
        sync: false
      # This API's own address, e.g. https://acacia-api.onrender.com
      - key: PUBLIC_API_URL
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE
        value: new_booking
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en
      # French + Swahili versions of packages and destinations (Google Cloud Translation)
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
